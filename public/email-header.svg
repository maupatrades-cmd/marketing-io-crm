<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="320" viewBox="0 0 1024 320">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="50%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#000010"/>
    </linearGradient>

    <!-- Sun radial gradient -->
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>

    <!-- Pink glow under horizon -->
    <linearGradient id="horizonGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <!-- Logo glow radial -->
    <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid glow blur filter -->
    <filter id="gridGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Bottom accent gradient -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Clip to bottom half of sun for slices -->
    <clipPath id="sunBottom">
      <rect x="422" y="180" width="180" height="90"/>
    </clipPath>

    <!-- White outline + neon glow filter for the logo. Dilates the alpha
         channel to create a slightly larger silhouette, floods that with
         white, blurs a copy for the soft neon halo, then stacks the
         original artwork on top so the brand colours stay intact while
         the letters read crisply against the dark synthwave sky. -->
    <filter id="logoOutline" x="-25%" y="-25%" width="150%" height="150%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2.5" result="outlineMask"/>
      <feFlood flood-color="#ffffff" flood-opacity="1" result="whiteFlood"/>
      <feComposite in="whiteFlood" in2="outlineMask" operator="in" result="whiteOutline"/>
      <feGaussianBlur in="whiteOutline" stdDeviation="3" result="outerGlow"/>
      <feMerge>
        <feMergeNode in="outerGlow"/>
        <feMergeNode in="whiteOutline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1024" height="320" fill="url(#bgGrad)"/>

  <!-- STARS -->
  <circle cx="80"  cy="28"  r="1.2" fill="white" opacity="0.8"/>
  <circle cx="195" cy="52"  r="1.0" fill="white" opacity="0.65"/>
  <circle cx="310" cy="18"  r="1.4" fill="white" opacity="0.9"/>
  <circle cx="430" cy="40"  r="1.1" fill="white" opacity="0.7"/>
  <circle cx="560" cy="22"  r="1.3" fill="white" opacity="0.85"/>
  <circle cx="650" cy="55"  r="1.0" fill="white" opacity="0.6"/>
  <circle cx="740" cy="15"  r="1.2" fill="white" opacity="0.75"/>
  <circle cx="840" cy="45"  r="1.4" fill="white" opacity="0.9"/>
  <circle cx="920" cy="30"  r="1.1" fill="white" opacity="0.7"/>
  <circle cx="980" cy="58"  r="1.0" fill="white" opacity="0.65"/>
  <circle cx="145" cy="75"  r="0.9" fill="white" opacity="0.6"/>
  <circle cx="875" cy="72"  r="1.0" fill="white" opacity="0.7"/>

  <!-- SUN -->
  <circle cx="512" cy="180" r="90" fill="url(#sunGrad)"/>

  <!-- SYNTHWAVE HORIZONTAL SLICES over bottom half of sun (background color cuts) -->
  <g clip-path="url(#sunBottom)">
    <rect x="432" y="195" width="160" height="8"  fill="#0a0a2e"/>
    <rect x="446" y="211" width="132" height="7"  fill="#0a0a2e"/>
    <rect x="460" y="226" width="104" height="6"  fill="#0a0a2e"/>
    <rect x="474" y="240" width="76"  height="6"  fill="#0a0a2e"/>
    <rect x="490" y="254" width="44"  height="5"  fill="#0a0a2e"/>
  </g>

  <!-- HORIZON GLOW (soft pink band below horizon) -->
  <rect x="0" y="180" width="1024" height="60" fill="url(#horizonGlow)"/>

  <!-- HORIZON LINE -->
  <line x1="0" y1="180" x2="1024" y2="180" stroke="#ec4899" stroke-width="1.5" opacity="0.9"/>

  <!-- PERSPECTIVE GRID - horizontal pink lines -->
  <g filter="url(#gridGlow)" opacity="0.75">
    <line x1="0" y1="196" x2="1024" y2="196" stroke="#ec4899" stroke-width="0.8"/>
    <line x1="0" y1="215" x2="1024" y2="215" stroke="#ec4899" stroke-width="0.9"/>
    <line x1="0" y1="238" x2="1024" y2="238" stroke="#ec4899" stroke-width="1.0"/>
    <line x1="0" y1="266" x2="1024" y2="266" stroke="#ec4899" stroke-width="1.1"/>
    <line x1="0" y1="288" x2="1024" y2="288" stroke="#ec4899" stroke-width="1.2"/>
    <line x1="0" y1="308" x2="1024" y2="308" stroke="#ec4899" stroke-width="1.3"/>
  </g>

  <!-- PERSPECTIVE GRID - vertical cyan radiating lines -->
  <g filter="url(#gridGlow)" opacity="0.65">
    <line x1="512" y1="180" x2="0"    y2="320" stroke="#06b6d4" stroke-width="0.8"/>
    <line x1="512" y1="180" x2="93"   y2="320" stroke="#06b6d4" stroke-width="0.8"/>
    <line x1="512" y1="180" x2="186"  y2="320" stroke="#06b6d4" stroke-width="0.8"/>
    <line x1="512" y1="180" x2="279"  y2="320" stroke="#06b6d4" stroke-width="0.8"/>
    <line x1="512" y1="180" x2="372"  y2="320" stroke="#06b6d4" stroke-width="0.8"/>
    <line x1="512" y1="180" x2="465"  y2="320" stroke="#06b6d4" stroke-width="0.8"/>
    <line x1="512" y1="180" x2="512"  y2="320" stroke="#06b6d4" stroke-width="0.8"/>
    <line x1="512" y1="180" x2="558"  y2="320" stroke="#06b6d4" stroke-width="0.8"/>
    <line x1="512" y1="180" x2="651"  y2="320" stroke="#06b6d4" stroke-width="0.8"/>
    <line x1="512" y1="180" x2="744"  y2="320" stroke="#06b6d4" stroke-width="0.8"/>
    <line x1="512" y1="180" x2="837"  y2="320" stroke="#06b6d4" stroke-width="0.8"/>
    <line x1="512" y1="180" x2="930"  y2="320" stroke="#06b6d4" stroke-width="0.8"/>
    <line x1="512" y1="180" x2="1024" y2="320" stroke="#06b6d4" stroke-width="0.8"/>
  </g>

  <!-- MOUNTAINS LEFT (purple/magenta) -->
  <polygon points="60,180 180,110 300,180"  fill="#7c3aed" opacity="0.65"/>
  <polygon points="150,180 240,130 330,180" fill="#a855f7" opacity="0.6"/>

  <!-- MOUNTAINS RIGHT (cyan/purple) -->
  <polygon points="694,180 784,120 874,180" fill="#06b6d4" opacity="0.55"/>
  <polygon points="780,180 880,125 980,180" fill="#7c3aed" opacity="0.6"/>

  <!-- LOGO GLOW HALO -->
  <ellipse cx="512" cy="70" rx="110" ry="55" fill="url(#logoGlow)"/>

  <!-- LOGO: actual Marketing iO brand mark, embedded via the public CDN URL.
       Centred on the halo. The outline + neon-glow filter wraps every letter
       in a white stroke so the dark-blue brand mark pops against the
       synthwave sky while keeping the original colours. -->
  <image href="https://media.base44.com/images/public/69f52863b2b733d922d90b62/ce0ebdea2_marketing_io_main_logo-removebg-preview.png"
         x="432" y="20" width="160" height="100"
         preserveAspectRatio="xMidYMid meet"
         filter="url(#logoOutline)"/>

  <!-- BOTTOM ACCENT STRIP -->
  <rect x="0" y="312" width="1024" height="8" fill="url(#accentGrad)"/>
</svg>
