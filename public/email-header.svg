<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" width="1024" height="320" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Marketing iO synthwave email header">
  <defs>
    <!-- Background: deep purple → midnight → near-black -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="50%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#000010"/>
    </linearGradient>

    <!-- Sun: yellow → pink → purple -->
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>

    <!-- Pink glow that fades down from the horizon -->
    <linearGradient id="horizonGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom accent strip: red → pink → yellow -->
    <linearGradient id="bottomAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- White radial halo behind the logo -->
    <radialGradient id="logoHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Gaussian glow for the perspective grid -->
    <filter id="gridGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>

    <!-- Mask that punches the synthwave slice cuts out of the bottom half
         of the sun. Slices get shorter (narrower) as they approach the
         centre line, so the silhouette reads as classic '80s sun. -->
    <mask id="sunSlices">
      <circle cx="512" cy="180" r="90" fill="white"/>
      <!-- Slice y positions cover the bottom half of the sun (180–270).
           Width tapers from wide near the bottom up to narrow near the
           centre — read top-to-bottom. -->
      <rect x="430" y="192" width="164" height="3" fill="black"/>
      <rect x="442" y="206" width="140" height="4" fill="black"/>
      <rect x="455" y="222" width="114" height="4" fill="black"/>
      <rect x="470" y="240" width="84"  height="5" fill="black"/>
      <rect x="486" y="258" width="52"  height="6" fill="black"/>
    </mask>
  </defs>

  <!-- Sky / background -->
  <rect width="1024" height="320" fill="url(#bg)"/>

  <!-- Stars in the upper third (y < ~107) -->
  <g fill="#ffffff">
    <circle cx="78"  cy="28"  r="1.2" opacity="0.85"/>
    <circle cx="172" cy="58"  r="1.0" opacity="0.6"/>
    <circle cx="256" cy="20"  r="1.5" opacity="0.9"/>
    <circle cx="342" cy="82"  r="1.0" opacity="0.7"/>
    <circle cx="448" cy="36"  r="1.2" opacity="0.8"/>
    <circle cx="592" cy="50"  r="1.0" opacity="0.6"/>
    <circle cx="700" cy="24"  r="1.5" opacity="0.9"/>
    <circle cx="804" cy="72"  r="1.2" opacity="0.7"/>
    <circle cx="892" cy="42"  r="1.0" opacity="0.85"/>
    <circle cx="966" cy="92"  r="1.3" opacity="0.65"/>
  </g>

  <!-- Sun, with synthwave slices punched out -->
  <circle cx="512" cy="180" r="90" fill="url(#sun)" mask="url(#sunSlices)"/>

  <!-- Soft pink glow under the horizon -->
  <rect x="0" y="180" width="1024" height="80" fill="url(#horizonGlow)"/>

  <!-- Horizon line -->
  <line x1="0" y1="180" x2="1024" y2="180" stroke="#ec4899" stroke-width="1.5"/>

  <!-- Mountain silhouettes sitting on the horizon -->
  <g opacity="0.65">
    <!-- Left: purple / magenta -->
    <polygon points="40,180 110,138 178,180"  fill="#7c3aed"/>
    <polygon points="140,180 208,128 274,180" fill="#a855f7"/>
    <!-- Right: cyan / purple -->
    <polygon points="752,180 820,142 884,180" fill="#06b6d4"/>
    <polygon points="864,180 938,130 1010,180" fill="#7c3aed"/>
  </g>

  <!-- Perspective grid (blurred for that neon glow read) -->
  <g filter="url(#gridGlow)">
    <!-- Six horizontal pink lines below the horizon, gaps grow with distance -->
    <g stroke="#ec4899" stroke-width="1" fill="none" opacity="0.85">
      <line x1="0" y1="192" x2="1024" y2="192"/>
      <line x1="0" y1="206" x2="1024" y2="206"/>
      <line x1="0" y1="225" x2="1024" y2="225"/>
      <line x1="0" y1="250" x2="1024" y2="250"/>
      <line x1="0" y1="282" x2="1024" y2="282"/>
      <line x1="0" y1="318" x2="1024" y2="318"/>
    </g>
    <!-- Eleven cyan radial lines from (512,180) to evenly spaced points
         along the bottom edge -->
    <g stroke="#06b6d4" stroke-width="1" fill="none" opacity="0.85">
      <line x1="512" y1="180" x2="0"    y2="320"/>
      <line x1="512" y1="180" x2="102"  y2="320"/>
      <line x1="512" y1="180" x2="205"  y2="320"/>
      <line x1="512" y1="180" x2="307"  y2="320"/>
      <line x1="512" y1="180" x2="410"  y2="320"/>
      <line x1="512" y1="180" x2="512"  y2="320"/>
      <line x1="512" y1="180" x2="614"  y2="320"/>
      <line x1="512" y1="180" x2="717"  y2="320"/>
      <line x1="512" y1="180" x2="819"  y2="320"/>
      <line x1="512" y1="180" x2="922"  y2="320"/>
      <line x1="512" y1="180" x2="1024" y2="320"/>
    </g>
  </g>

  <!-- Logo halo: white radial glow centred at (512, 70) -->
  <circle cx="512" cy="70" r="80" fill="url(#logoHalo)"/>

  <!-- Logo wordmark — rendered as text so the SVG stays self-contained.
       Swap to <image href="..."/> if you want the bitmap brand mark. -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="512" y="68" font-size="30" font-weight="800" fill="#1e40af" letter-spacing="3">MARKETING</text>
    <text x="512" y="96" font-size="22" font-weight="700" fill="#1e40af" letter-spacing="6">i O</text>
  </g>

  <!-- Bottom accent strip -->
  <rect x="0" y="312" width="1024" height="8" fill="url(#bottomAccent)"/>
</svg>
