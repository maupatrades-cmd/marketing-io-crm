<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing iO Email — Synthwave Preview</title>
  <style>
    body { margin:0; padding:24px 12px; background-color:#1a0533; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .stage { max-width:640px; margin:0 auto; }
    .label { color:#a8a8c0; font-size:12px; letter-spacing:1px; text-transform:uppercase; margin:24px 0 8px; padding-left:6px; }
    .shell { background:#ffffff; border-radius:6px; overflow:hidden; box-shadow:0 8px 32px rgba(0,0,0,0.45); }
  </style>
</head>
<body>
  <div class="stage">
    <div class="label">Header — 600 × 240</div>
    <div class="shell" id="header-slot"></div>

    <div class="label">Full email — header · body · footer</div>
    <div class="shell" id="full-slot"></div>

    <div class="label">Footer — 600 × ~340</div>
    <div class="shell" id="footer-slot"></div>
  </div>

  <script type="module">
    import { emailHeaderSynthwave } from './emailHeaderSynthwave.js';
    import { emailFooterSynthwave } from './emailFooterSynthwave.js';
    import { wrapEmail, h1, p, ctaButton, otpBlock } from './emailWrapper.js';

    document.getElementById('header-slot').innerHTML = emailHeaderSynthwave();
    document.getElementById('footer-slot').innerHTML = emailFooterSynthwave();

    const body = `${h1('Welcome to Marketing iO, Thapelo')}
      ${p("This is placeholder body content sitting between the header and footer to show the full email shell. The actual transactional emails (login OTP, invoice issued, password reset, welcome pack) will swap this section for their real content.")}
      ${otpBlock('482-915')}
      ${p('The OTP block above is one of the helpers exported from <code>emailWrapper.js</code> — alongside <code>ctaButton</code>, <code>h1</code>, and <code>p</code>.')}
      ${ctaButton('Open the client portal', 'https://app.marketingio.africa/client-portal')}
      ${p('Anything you put inside the body cell renders on a clean white background sandwiched between the synthwave header and the rainbow-waves footer.')}`;

    document.getElementById('full-slot').innerHTML = wrapEmail(body, { preheader: 'Synthwave email preview' });
  </script>
</body>
</html>
